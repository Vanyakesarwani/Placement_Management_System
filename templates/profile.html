<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
</head>

<body>

    <h1>My Profile</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <hr>

    <form method="POST">

        <p>
            <strong>Name:</strong>
            {{ user.name if user else student.name }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ user.email if user else student.email }}
        </p>

        <p>
            <label>Roll Number:</label>
            <input type="text"
                   name="roll_number"
                   value="{{ student.roll_number if student else '' }}"
                   required>
        </p>

        <p>
            <label>Branch:</label>
            <input type="text"
                   name="branch"
                   value="{{ student.branch if student else '' }}"
                   required>
        </p>

        <p>
            <label>CGPA:</label>
            <input type="number"
                   name="cgpa"
                   step="0.01"
                   min="0"
                   max="10"
                   value="{{ student.cgpa if student else '' }}"
                   required>
        </p>

        <p>
            <label>Backlogs:</label>
            <input type="number"
                   name="backlogs"
                   min="0"
                   value="{{ student.backlogs if student else '' }}"
                   required>
        </p>

        <p>
            <label>Skills:</label>
            <input type="text"
                   name="skills"
                   value="{{ student.skills if student else '' }}">
        </p>

        <button type="submit">Save Changes</button>

    </form>

    <hr>

    <a href="{{ url_for('student') }}">
        Back to Dashboard
    </a>

</body>
</html>
