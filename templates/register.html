<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

    <h1>Student Registration</h1>

    <form action="/register" method="POST">

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <input type="password" name="confirm_password"
            placeholder="Confirm Password" required>

        <input type="text" name="roll_number" placeholder="Roll Number" required>

        <input type="text" name="branch" placeholder="Branch" required>

        <input type="number" step="0.01" name="cgpa" placeholder="CGPA" required>

        <input type="number" name="backlogs" placeholder="Backlogs" required>

        <input type="text" name="skills" placeholder="Skills" required>

        <button type="submit">Register</button>
    </form>
</body>
</html>
